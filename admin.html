<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Constituency Netball Championship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Netball Championship</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="fixtures.html">Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link" href="results.html">Results</a></li>
                    <li class="nav-item"><a class="nav-link" href="standings.html">Standings</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin.html">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4" id="admin-content" style="display: none;">
        <h1 class="text-center">Admin Portal - Update Match Results</h1>
        <div class="mb-4">
            <h3>Update Match Result</h3>
            <form id="admin-result-form">
                <div class="mb-3">
                    <label for="matchNo" class="form-label">Match No. (e.g., V1)</label>
                    <select class="form-control" id="matchNo" required>
                        <option value="">Select Match</option>
                        <!-- Populated dynamically from fixtures -->
                    </select>
                </div>
                <div class="mb-3">
                    <label for="homeScore" class="form-label">Home Team Score</label>
                    <input type="number" class="form-control" id="homeScore" min="0" required>
                </div>
                <div class="mb-3">
                    <label for="awayScore" class="form-label">Away Team Score</label>
                    <input type="number" class="form-control" id="awayScore" min="0" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Result</button>
            </form>
        </div>
        <h3>Existing Results</h3>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Match No.</th>
                    <th>Date</th>
                    <th>Home Team</th>
                    <th>Score</th>
                    <th>Away Team</th>
                    <th>Venue</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="admin-results-table"></tbody>
        </table>
        <button id="logout-btn" class="btn btn-danger mt-3">Logout</button>
    </div>
    <div class="container mt-4" id="login-content">
        <h1 class="text-center">Admin Login</h1>
        <form id="login-form" class="w-50 mx-auto">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
    <footer class="text-center mt-5 py-3 bg-light">
        <p>&copy; 2025 Constituency Netball Championship. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
